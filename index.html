<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생각 기록 타이머</title>
  <!-- 글꼴(인터넷이 없으면 기본 글꼴로 표시됨) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- SNS 이미지용 손글씨 글꼴 (Gaegu) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/700.css">
  <!-- ?v=날짜 : 파일을 고칠 때마다 바꾸면, 브라우저가 예전 파일 대신 새 파일을 받아 옴 -->
  <link rel="stylesheet" href="style.css?v=20261120-2">
</head>
<body>
  <!-- 왼쪽 사이드바 : 앱 이름 + 메뉴 (생각 보관함 / 공부 기록함 / 화면 색상)
       공부 중에는 사이드바가 숨겨짐 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>생각 기록 타이머</h1>
      <p class="subtitle">잡생각은 적어 두고, <span data-w>공부</span>는 계속하기</p>
    </div>
    <nav class="side-nav">
      <button id="openVault" class="side-link lockable" type="button">💭 생각 보관함 <span id="vaultCount" class="side-count"></span></button>
      <button id="openHistory" class="side-link lockable" type="button">📊 <span data-w>공부</span> 기록함</button>
      <button id="openTheme" class="side-link" type="button">🎨 화면 색상</button>
    </nav>
    <!-- 공부용 / 업무용 : 고르면 화면의 '공부'가 '업무'로 바뀜 -->
    <div class="use-tabs" role="group" aria-label="사용 용도">
      <button class="use-btn" type="button" data-use="study">공부용</button>
      <button class="use-btn" type="button" data-use="work">업무용</button>
    </div>
  </aside>

  <main class="layout">
    <!-- 공부 중일 때 박스들 위에 크게 보이는 표시 -->
    <div id="studyBanner" class="study-banner" hidden>
      <span class="live-dot"></span><span id="bannerText"></span>
    </div>


    <!-- ① 공부 공간 : 타이머 -->
    <section class="card timer-card" id="timerSection" data-phase="idle">
      <h2 class="timer-title"><span data-w>공부</span> 타이머</h2>

      <!-- 집중 · 휴식 시간 고르기 (공부 중에는 숨김)
           집중 '제한 없음' = 계속 흐르는 타이머 / 시간을 고르면 집중 ↔ 휴식 반복 (뽀모도로) -->
      <div id="pomoSettings" class="pomo-settings">
        <div class="time-row">
          <span class="time-label">집중</span>
          <div id="focusChoices" class="time-choices"></div>
        </div>
        <div id="breakRow" class="time-row" hidden>
          <span class="time-label">휴식</span>
          <div id="breakChoices" class="time-choices"></div>
        </div>
      </div>

      <!-- 할 내용을 적어야 시작할 수 있음 (안내 문구는 공부용 / 업무용에 따라 script.js에서) -->
      <input id="goalInput" type="text" maxlength="40">

      <div class="timer-display">
        <span id="phaseLabel" class="phase-label">대기 중</span>
        <span id="timeText" class="time-text">00:00:00</span>
        <span id="studyTotal" class="study-total"></span>
      </div>

      <div class="timer-controls">
        <button id="startBtn" class="btn primary">시작</button>
        <button id="stopBtn" class="btn danger" disabled>종료</button>
      </div>

      <!-- 오늘 한 공부 이어하기 : 공부 중이 아닐 때, 오늘 기록이 있으면 보임 -->
      <div id="resumeBox" class="resume-box" hidden>
        <p class="resume-title">오늘 한 <span data-w>공부</span> 이어하기</p>
        <div id="resumeList" class="resume-list"></div>
      </div>
      <p id="timerToast" class="toast" aria-live="polite"></p>
    </section>

    <!-- ② 생각 보관 공간 : 메모 입력 -->
    <section class="card memo-card">
      <div class="card-head">
        <h2>떠오른 생각 적기</h2>
        <!-- 지금 보관 중인 생각 개수 (공부 중에는 이번 공부에서 적은 개수) -->
        <span id="memoCount" class="memo-count"></span>
      </div>
      <form id="memoForm">
        <!-- 공부 질문일 때만 누르는 버튼 (안 누르면 자동 분류) -->
        <button id="studyQBtn" class="q-toggle" type="button" aria-pressed="false">📌 <span data-w>공부</span> 질문</button>
        <textarea id="memoInput" rows="3"
                  placeholder="떠오른 생각 (Enter 저장)"></textarea>
        <p id="autoHint" class="auto-hint" aria-live="polite"></p>
        <button type="submit" class="btn primary">보관함에 넣기</button>
      </form>
      <p id="memoToast" class="toast" aria-live="polite"></p>

      <p class="focus-note">🔒 끝나면 한꺼번에 보여 드려요</p>
    </section>

    <!-- ③ 📌 공부 질문 : 보관함이 잠겨 있어도 계속 보이는 칸 (동그라미를 누르면 해결 → 바로 지워짐) -->
    <section class="card pinned-card">
      <div class="card-head">
        <h2>📌 <span data-w>공부</span> 질문</h2>
        <span id="pinnedCount" class="muted"></span>
      </div>
      <p id="pinnedEmpty" class="pinned-empty">질문을 적으면 여기에 떠 있어요</p>
      <ul id="pinnedList" class="pinned-list"></ul>
    </section>

  </main>

  <!-- 옆에서 열리는 창 뒤의 어두운 배경 (누르면 창이 닫힘) -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- ⑤ 공부 기록함 : 사이드바의 "공부 기록함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="historyDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="sheet-head">
      <h2 id="historyTitle"><span data-w>공부</span> 기록함</h2>
      <button id="closeHistory" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="sheet-toolbar">
      <div class="mode-tabs">
        <button class="hist-tab active" data-view="month">월간</button>
        <button class="hist-tab" data-view="year">연간</button>
      </div>
      <div class="period-nav">
        <button id="prevPeriod" class="nav-btn" aria-label="이전">‹</button>
        <span id="periodLabel"></span>
        <button id="nextPeriod" class="nav-btn" aria-label="다음">›</button>
      </div>
    </div>

    <div class="summary-row">
      <div class="stat"><span class="stat-label">총 <span data-w>공부</span> 시간</span><strong id="statTotal">0분</strong></div>
      <div class="stat"><span class="stat-label"><span data-w>공부</span>한 날</span><strong id="statDays">0일</strong></div>
      <div class="stat"><span class="stat-label">하루 평균</span><strong id="statAvg">-</strong></div>
    </div>

    <div id="historyChart" class="history-chart"></div>
    <p id="historyEmpty" class="empty" hidden>기록이 없어요</p>

    <!-- 월간 보기에서만: 그 달의 공부 기록 목록 (누르면 이어서 공부) -->
    <div id="historyListBox">
      <h3 class="drawer-sub">이 달의 기록</h3>
      <ul id="historyList" class="record-list"></ul>
    </div>

    <!-- SNS에 올릴 이미지 만들기 (canvas로 그려서 PNG로 저장) -->
    <div class="share-box">
      <h3 class="drawer-sub">SNS에 올릴 이미지 만들기</h3>
      <canvas id="shareCanvas" class="share-preview" aria-label="SNS 이미지 미리보기"></canvas>
      <div class="share-buttons">
        <button id="shareSave" class="btn primary" type="button">이미지 저장</button>
        <button id="shareSend" class="btn" type="button" hidden>공유하기</button>
      </div>
      <p id="shareToast" class="toast" aria-live="polite"></p>
    </div>
  </section>

  <!-- ⑦ 화면 색상 : 사이드바의 "화면 색상"을 누르면 왼쪽에서 열리는 창 -->
  <section id="themeDrawer" class="drawer drawer-left drawer-narrow" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
    <div class="sheet-head">
      <h2 id="themeTitle">화면 색상</h2>
      <button id="closeTheme" class="icon-close" aria-label="닫기">×</button>
    </div>

    <h3 class="drawer-sub">대표색</h3>
    <div id="themePresets" class="theme-presets"></div>

    <label class="theme-custom">
      <input id="colorMain" type="color"> 직접 고르기
    </label>
    <button id="themeReset" class="btn" type="button">기본 색으로</button>
  </section>

  <!-- ⑥ 생각 보관함 : 사이드바의 "생각 보관함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="vaultDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="vaultTitle">
    <div class="sheet-head">
      <h2 id="vaultTitle">생각 보관함</h2>
      <button id="closeVault" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="drawer-toolbar">
      <select id="filterSelect" aria-label="카테고리 필터"></select>
      <span id="vaultTotal" class="muted"></span>
    </div>

    <div id="vaultList"></div>
  </section>

  <!-- ⑧ 공부를 마치면 뜨는 창 : 이번 공부 동안 적은 생각만 보여 줌 → '확인 완료'로 닫기 -->
  <div id="reviewModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
    <div class="modal-box">
      <h2 id="reviewTitle"></h2>
      <p id="reviewDesc" class="muted"></p>
      <ul id="reviewList" class="memo-list review-list"></ul>
      <button id="reviewDone" class="btn primary" type="button">확인 완료</button>
    </div>
  </div>

  <script src="script.js?v=20261120-2"></script>
</body>
</html>
