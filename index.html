<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생각 기록 타이머</title>
  <!-- 탭 아이콘 (작은 크기용 로고) -->
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"%3E%3Cg fill="none" stroke="%233A3A3A" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"%3E%3Cpath d="M70 66 C70 40 88 26 110 26 C134 26 150 46 154 70 L150 100 Q110 80 70 66 Z" fill="%23FFFFFF" stroke="none"/%3E%3Cpath d="M70 66 C70 40 88 26 110 26 C134 26 150 46 154 70 C156 80 154 88 150 94"/%3E%3Ccircle cx="102" cy="52" r="8" fill="%233A3A3A" stroke="none"/%3E%3Ccircle cx="126" cy="56" r="8" fill="%233A3A3A" stroke="none"/%3E%3Ccircle cx="92" cy="124" r="62" fill="%23F5EDDA"/%3E%3Cpath d="M88 82 L90 124 L128 120"/%3E%3C/g%3E%3C/svg%3E'>
  <!-- 글꼴(인터넷이 없으면 기본 글꼴로 표시됨) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- SNS 이미지용 손글씨 글꼴 (Gaegu) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/700.css">
  <!-- SNS 이미지에서 고를 수 있는 글꼴들 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nanum-pen-script@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/hi-melody@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jua@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gowun-dodum@5/400.css">
  <!-- ?v=날짜 : 파일을 고칠 때마다 바꾸면, 브라우저가 예전 파일 대신 새 파일을 받아 옴 -->
  <link rel="stylesheet" href="style.css?v=20261128-2">
</head>
<body>
  <!-- 맨 왼쪽 위 로고 : 누르면 사이드바를 숨기거나 다시 보여 줌 (공부 중에는 숨김) -->
  <button id="sideToggle" class="side-toggle" type="button" aria-label="사이드바 숨기기" title="사이드바 숨기기 / 보이기">
    <svg class="side-logo" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(4 4)"><ellipse cx="131" cy="27" rx="10" ry="5.5" transform="rotate(-18 131 27)" stroke-width="6"/><path d="M86 69 C86 50 98 39 113 39 C130 39 141 54 145 72 C147 82 144 90 140 95 Q115 78 86 69 Z" fill="#FFFFFF" stroke="none"/><path d="M86 69 C86 50 98 39 113 39 C130 39 141 54 145 72 C147 82 144 90 140 95"/><circle cx="107" cy="58" r="4" fill="currentColor" stroke="none"/><circle cx="124" cy="62" r="4" fill="currentColor" stroke="none"/><circle cx="95" cy="120" r="52" fill="#F5EDDA"/><path d="M91 84 L93 117 L126 114"/><path d="M30 106 C18 108 12 122 20 132 C30 142 52 144 74 133"/><path d="M145 76 C158 70 176 70 178 84 C179 94 160 106 143 113"/></g></g></svg>
  </button>

  <!-- 왼쪽 사이드바 : 앱 이름 + 메뉴 (생각 보관함 / 기록함) + 화면 색상
       공부 중에는 사이드바가 숨겨짐 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>생각 기록 타이머</h1>
      <p class="subtitle">잡생각은 적어 두고, 공부는 계속하기</p>
    </div>
    <nav class="side-nav">
      <button id="openVault" class="side-link" type="button">💭 생각 보관함 <span id="vaultCount" class="side-count"></span></button>
      <button id="openHistory" class="side-link" type="button">📊 기록함</button>
    </nav>
    <!-- 화면 색상 : 창을 열지 않고 동그라미를 누르면 바로 바뀜
         마지막 무지개 동그라미 = 원하는 색 직접 고르기 -->
    <div class="side-colors">
      <span class="side-colors-label">화면 색상</span>
      <div class="theme-row">
        <div id="themePresets" class="theme-presets"></div>
        <label id="customTheme" class="theme-btn theme-custom" title="직접 고르기">
          <span id="customDot" class="theme-dot"></span>
          <input id="colorMain" type="color" aria-label="원하는 색 직접 고르기">
        </label>
      </div>
    </div>

    <!-- 로그인 : 구글 계정으로 로그인하면 다른 기기에서도 같은 기록이 보임 (sync.js)
         firebase-config.js를 채우기 전에는 안 보임 -->
    <div id="account" class="account" hidden>
      <button id="loginBtn" class="login-btn" type="button">구글로 로그인</button>
      <div id="profile" class="profile" hidden>
        <span class="profile-pic">
          <span id="profileInitial"></span>
          <img id="profilePhoto" alt="" referrerpolicy="no-referrer" hidden>
        </span>
        <span class="profile-text">
          <span id="profileName" class="profile-name"></span>
          <span id="syncState" class="sync-state"></span>
        </span>
        <button id="logoutBtn" class="logout-btn" type="button">로그아웃</button>
      </div>
    </div>
  </aside>

  <main class="layout">
    <!-- 공부 중일 때 박스들 위에 크게 보이는 공부 이름 -->
    <div id="studyBanner" class="study-banner" hidden>
      <span class="live-dot"></span><span id="bannerText"></span>
    </div>


    <!-- ① 공부 공간 : 타이머 -->
    <section class="card timer-card" id="timerSection" data-phase="idle">
      <div class="timer-head">
        <h2 class="timer-title">타이머</h2>
        <!-- 시작 전에만 보이는 작은 버튼 : 누르면 타이머 옆에 메모장 / 할 일이 열림 -->
        <div class="note-btns">
          <button id="openNote" class="note-btn" type="button" aria-pressed="false">📝 메모장</button>
          <button id="openTodo" class="note-btn" type="button" aria-pressed="false">✅ 할 일</button>
        </div>
      </div>

      <!-- 집중 · 휴식 시간 고르기 (공부 중에는 숨김)
           위 탭으로 집중 / 휴식을 고르고 → 아래 시간 버튼이나 +5 · +10분으로 맞춤
           집중 '제한 없음' = 계속 흐르는 타이머 / 시간을 정하면 집중 ↔ 휴식 반복 (뽀모도로) -->
      <div id="pomoSettings" class="pomo-settings">
        <div class="pomo-tabs">
          <button class="pomo-tab" type="button" data-tab="focus">집중 <span id="focusValue"></span></button>
          <button class="pomo-tab" type="button" data-tab="break">휴식 <span id="breakValue"></span></button>
        </div>
        <div class="time-row">
          <div id="timeChoices" class="time-choices"></div>
          <div class="time-adds">
            <button class="time-chip time-add" type="button" data-add="5">+5분</button>
            <button class="time-chip time-add" type="button" data-add="10">+10분</button>
          </div>
        </div>
      </div>

      <!-- 이름 (비워 두면 '1', '2' …) — 시작하면 숨겨지고, 끝난 뒤에 고칠 수 있음 -->
      <input id="goalInput" type="text" maxlength="40">

      <div class="timer-display">
        <span id="phaseLabel" class="phase-label">대기 중</span>
        <span id="timeText" class="time-text">00:00:00</span>
        <span id="studyTotal" class="study-total"></span>
      </div>

      <div class="timer-controls">
        <button id="startBtn" class="btn primary">시작</button>
        <button id="stopBtn" class="btn danger" disabled>종료</button>
      </div>

      <!-- 오늘 한 공부 이어하기 : 공부 중이 아닐 때, 오늘 기록이 있으면 보임 -->
      <div id="resumeBox" class="resume-box" hidden>
        <p class="resume-title">오늘 기록 이어하기</p>
        <div id="resumeList" class="resume-list"></div>
      </div>
      <p id="timerToast" class="toast" aria-live="polite"></p>
    </section>

    <!-- ② 생각 보관 공간 : 메모 입력 (공부 중에만 보임) -->
    <section class="card memo-card">
      <div class="card-head">
        <h2>떠오른 생각 적기</h2>
        <!-- 지금 보관 중인 생각 개수 (공부 중에는 이번 공부에서 적은 개수) -->
        <span id="memoCount" class="memo-count"></span>
      </div>
      <form id="memoForm">
        <textarea id="memoInput" rows="3"
                  placeholder="떠오른 생각 (Enter 저장)"></textarea>
        <p id="autoHint" class="auto-hint" aria-live="polite"></p>
        <button type="submit" class="btn primary">보관함에 넣기</button>
      </form>
      <p id="memoToast" class="toast" aria-live="polite"></p>

      <p class="focus-note">🔒 끝나면 한꺼번에 보여 드려요</p>
    </section>

    <!-- ③ 📝 메모장 / ✅ 할 일 : 위쪽 버튼으로 바꿔 가며 씀 (적는 대로 저장)
         공부 중에는 항상 보이고, 시작 전에는 '📝 메모장' 버튼을 눌렀을 때만 타이머 옆에 보임 -->
    <section class="card pinned-card">
      <div class="card-head">
        <div class="pad-tabs">
          <button class="pad-tab" type="button" data-pad="note">📝 메모장</button>
          <button class="pad-tab" type="button" data-pad="todo">✅ 할 일</button>
        </div>
        <span class="note-head-right">
          <span id="noteSaved" class="muted"></span>
          <button id="closeNote" class="icon-close note-close" type="button" aria-label="메모장 닫기">×</button>
        </span>
      </div>
      <textarea id="noteInput" class="note-area" placeholder="자유롭게 적어 두세요"></textarea>

      <!-- ✅ 할 일 목록 (Enter로 추가, 체크하면 줄 그어짐) -->
      <div id="todoPane" class="todo-pane" hidden>
        <form id="todoForm" class="todo-form">
          <input id="todoInput" type="text" maxlength="100" placeholder="할 일 추가 (Enter)" aria-label="할 일 추가">
          <button type="submit" class="btn primary">추가</button>
        </form>
        <ul id="todoList" class="todo-list"></ul>
        <div class="todo-foot">
          <span id="todoLeft"></span>
          <button id="todoClear" class="todo-clear" type="button" hidden>완료한 것 지우기</button>
        </div>
      </div>
    </section>

  </main>

  <!-- 옆에서 열리는 창 뒤의 어두운 배경 (누르면 창이 닫힘) -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- ⑤ 기록함 : 사이드바의 "기록함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="historyDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="sheet-head">
      <h2 id="historyTitle">기록함</h2>
      <button id="closeHistory" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="sheet-toolbar">
      <div class="mode-tabs">
        <button class="hist-tab active" data-view="week">주간</button>
        <button class="hist-tab" data-view="month">월간</button>
      </div>
      <div class="period-nav">
        <button id="prevPeriod" class="nav-btn" aria-label="이전">‹</button>
        <span id="periodLabel"></span>
        <button id="nextPeriod" class="nav-btn" aria-label="다음">›</button>
      </div>
    </div>

    <div class="summary-row">
      <div class="stat"><span class="stat-label">총 시간</span><strong id="statTotal">0분</strong></div>
      <div class="stat"><span class="stat-label">기록한 날</span><strong id="statDays">0일</strong></div>
      <div class="stat"><span class="stat-label">하루 평균</span><strong id="statAvg">-</strong></div>
    </div>

    <div id="historyChart" class="history-chart"></div>
    <p id="historyEmpty" class="empty with-char" hidden>기록이 없어요</p>

    <!-- 그 주 / 그 달의 공부 기록 목록 ('수정'으로 이름 고치기) -->
    <div id="historyListBox">
      <h3 id="historyListTitle" class="drawer-sub"></h3>
      <ul id="historyList" class="record-list"></ul>
    </div>

    <!-- SNS에 올릴 이미지 만들기 (canvas로 그려서 PNG로 저장) -->
    <div class="share-box">
      <h3 class="drawer-sub">이미지 만들기</h3>
      <canvas id="shareCanvas" class="share-preview" aria-label="SNS 이미지 미리보기"></canvas>

      <div class="share-buttons">
        <button id="openShareEdit" class="btn" type="button">수정</button>
        <button id="shareSave" class="btn primary" type="button">이미지 저장</button>
        <button id="shareSend" class="btn" type="button" hidden>공유하기</button>
      </div>
      <p id="shareToast" class="toast" aria-live="polite"></p>
    </div>
  </section>


  <!-- ⑥ 생각 보관함 : 사이드바의 "생각 보관함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="vaultDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="vaultTitle">
    <div class="sheet-head">
      <h2 id="vaultTitle">생각 보관함</h2>
      <button id="closeVault" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="drawer-toolbar">
      <select id="filterSelect" aria-label="카테고리 필터"></select>
      <span id="vaultTotal" class="muted"></span>
    </div>

    <div id="vaultList"></div>
  </section>

  <!-- ⑧ 공부를 마치면 뜨는 창 : 이름 · 시간 고치기 + 이번 공부 동안 적은 생각 → '확인 완료'로 닫기 -->
  <div id="reviewModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
    <div class="modal-box">
      <div class="review-char" aria-hidden="true"></div>
      <h2 id="reviewTitle"></h2>


      <p id="reviewDesc" class="muted"></p>
      <ul id="reviewList" class="memo-list review-list"></ul>
      <button id="reviewDone" class="btn primary" type="button">확인 완료</button>
    </div>
  </div>

  <!-- ⑨ SNS 이미지 수정 : 기록함의 '수정'을 누르면 가운데에 뜨는 창
       왼쪽 큰 미리보기 + 오른쪽 꾸미기 (고르는 대로 미리보기가 바로 바뀜) -->
  <div id="shareModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle" hidden>
    <div class="modal-box share-modal-box">
      <div class="sheet-head">
        <h2 id="shareModalTitle">이미지 꾸미기</h2>
        <button id="closeShareModal" class="icon-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="share-edit">
        <canvas id="shareCanvasBig" class="share-preview-big" aria-label="SNS 이미지 큰 미리보기"></canvas>
        <div class="share-options">
          <div class="opt-group">
            <span class="opt-label">문장</span>
            <div class="opt-chips">
              <!-- 오늘의 명언 : 누를 때마다 다른 명언으로 바뀜 -->
              <button class="time-chip" type="button" data-text-mode="quote">오늘의 명언</button>
              <button class="time-chip" type="button" data-text-mode="custom">직접 쓰기</button>
            </div>
            <input id="shareText" type="text" maxlength="50" placeholder="넣고 싶은 문장" hidden>
          </div>
          <div class="opt-group">
            <span class="opt-label">글꼴</span>
            <div id="shareFonts" class="opt-chips"></div>
          </div>
          <div class="opt-group">
            <span class="opt-label">색상</span>
            <div class="opt-chips">
              <div id="sharePalettes" class="opt-chips"></div>
              <!-- 무지개 = 원하는 색 직접 고르기 (그 색으로 배경 · 형광펜 색을 만듦) -->
              <label id="paletteCustom" class="palette-btn palette-rainbow" title="직접 고르기">
                <input id="paletteColor" type="color" aria-label="이미지 색 직접 고르기">
              </label>
            </div>
          </div>
          <div class="opt-group">
            <span class="opt-label">과목 색</span>
            <div id="subjectList" class="subject-list"></div>
          </div>
        </div>
      </div>
      <div class="share-buttons">
        <button id="shareModalSave" class="btn" type="button">이미지 저장</button>
        <button id="shareModalDone" class="btn primary" type="button">완료</button>
      </div>
      <p id="shareModalToast" class="toast" aria-live="polite"></p>
    </div>
  </div>

  <!-- 구글 로그인 · 기록 동기화 (Firebase) — 인터넷이 없으면 로그인 없이 그대로 작동 -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=20261128-2"></script>
  <script src="sync.js?v=20261128-2"></script>
  <script src="script.js?v=20261128-2"></script>
</body>
</html>
