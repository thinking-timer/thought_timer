<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생각 기록 타이머</title>
  <!-- 글꼴(인터넷이 없으면 기본 글꼴로 표시됨) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <!-- 손글씨 글꼴 (Gaegu) : 공부 질문 메모지, SNS 이미지 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/gaegu@5.3.0/700.css">
  <!-- ?v=날짜 : 파일을 고칠 때마다 바꾸면, 브라우저가 예전 파일 대신 새 파일을 받아 옴 -->
  <link rel="stylesheet" href="style.css?v=20261126-4">
</head>
<body>
  <!-- 왼쪽 사이드바 (챗지피티처럼 접고 펼 수 있음, 공부 중에는 숨겨짐)
       위: 앱 이름 + 접기 / 새 공부 / 메뉴 / 오늘 한 공부 목록 / 아래: 화면 색상 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <span class="logo">생각 기록 타이머</span>
      <button id="sideClose" class="icon-btn" type="button" aria-label="사이드바 닫기" title="사이드바 닫기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>

    <nav class="side-nav">
      <button id="newStudy" class="side-link" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        새 공부
      </button>
      <button id="openVault" class="side-link" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 5h14v10H9l-4 4V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        생각 보관함 <span id="vaultCount" class="side-count"></span>
      </button>
      <button id="openHistory" class="side-link" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        공부 기록함
      </button>
    </nav>

    <!-- 오늘 한 공부 : 누르면 이어서 공부, 연필 = 이름 바꾸기, 휴지통 = 삭제 -->
    <div class="side-section">
      <p class="side-title">오늘</p>
      <ul id="todayList" class="today-list"></ul>
    </div>

    <!-- 화면 색상 : 대표색 3가지 + 무지개 동그라미(모든 색 중에서 직접 고르기) -->
    <div class="side-bottom">
      <div class="theme-row">
        <div id="themePresets" class="theme-dots" aria-label="화면 색상"></div>
        <label id="customColorBtn" class="theme-btn custom-color" title="직접 고르기">
          <input id="colorMain" type="color" aria-label="색 직접 고르기">
          <span id="customDot" class="theme-dot rainbow"></span>
        </label>
      </div>
    </div>
  </aside>

  <!-- 사이드바를 접었을 때 왼쪽 위에 보이는 열기 버튼 -->
  <button id="sideOpen" class="side-open icon-btn" type="button" aria-label="사이드바 열기" title="사이드바 열기">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>

  <main class="layout">
    <!-- 공부 중일 때 박스들 위에 크게 보이는 공부 이름 -->
    <div id="studyBanner" class="study-banner" hidden>
      <span class="live-dot"></span><span id="bannerText"></span>
    </div>

    <!-- ① 타이머 (시작 전에는 이것만 보임) -->
    <section class="card timer-card" id="timerSection" data-phase="idle">
      <div class="timer-head">
        <h2 class="timer-title">공부 타이머</h2>
        <!-- 시작 전: 작은 버튼을 누르면 공부 질문 창이 뜸 -->
        <button id="openQuestions" class="q-open" type="button">📌 공부 질문 <span id="qCount"></span></button>
      </div>

      <!-- 집중 · 휴식 시간 고르기 (공부 중에는 숨김)
           집중 '제한 없음' = 계속 흐르는 타이머 / 시간을 고르면 집중 ↔ 휴식 반복 (뽀모도로) -->
      <div id="pomoSettings" class="pomo-settings">
        <div class="time-row">
          <span class="time-label">집중</span>
          <div id="focusChoices" class="time-choices"></div>
        </div>
        <div id="breakRow" class="time-row" hidden>
          <span class="time-label">휴식</span>
          <div id="breakChoices" class="time-choices"></div>
        </div>
      </div>

      <!-- 공부 이름 (비워 두면 '공부1'처럼 자동으로, 공부 중에는 숨김 → 끝난 뒤 사이드바에서 바꿀 수 있음) -->
      <input id="goalInput" type="text" maxlength="40" placeholder="공부 이름 (비워 두면 자동으로 정해져요)">

      <div class="timer-display">
        <span id="phaseLabel" class="phase-label"></span>
        <span id="timeText" class="time-text">00:00:00</span>
        <span id="studyTotal" class="study-total"></span>
      </div>

      <div class="timer-controls">
        <button id="startBtn" class="btn primary">시작</button>
        <button id="stopBtn" class="btn danger" disabled>종료</button>
      </div>
      <p id="timerToast" class="toast" aria-live="polite"></p>
    </section>

    <!-- ② 떠오른 생각 적기 (공부 중에만 보임) -->
    <section class="card memo-card">
      <div class="card-head">
        <h2>떠오른 생각 적기</h2>
        <span id="memoCount" class="memo-count"></span>
      </div>
      <form id="memoForm">
        <textarea id="memoInput" rows="2" placeholder="떠오른 생각 (Enter 저장)"></textarea>
        <!-- 아래 한 줄: 공부 질문 버튼(안 누르면 자동 분류) · 어디로 들어갈지 · 넣기 -->
        <div class="memo-actions">
          <button id="studyQBtn" class="q-toggle" type="button" aria-pressed="false">📌 공부 질문</button>
          <p id="autoHint" class="auto-hint" aria-live="polite"></p>
          <button type="submit" class="btn primary small">넣기</button>
        </div>
      </form>
      <p id="memoToast" class="toast" aria-live="polite"></p>
    </section>

    <!-- ③ 📌 공부 질문 칸 (공부 중에 생각 적기 칸 아래, 눌러서 바로 고치기 · 동그라미 = 해결 → 지워짐) -->
    <section class="card notes-area">
      <h2 id="notesTitle" class="notes-title">📌 공부 질문</h2>
      <p id="notesEmpty" class="notes-empty">질문을 적으면 여기에 떠 있어요</p>
      <ul id="pinnedList" class="sticky-list"></ul>
    </section>
  </main>

  <!-- 옆에서 열리는 창 뒤의 어두운 배경 (누르면 창이 닫힘) -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- ④ 공부 기록함 : 사이드바의 "공부 기록함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="historyDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
    <div class="sheet-head">
      <h2 id="historyTitle">공부 기록함</h2>
      <button id="closeHistory" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="sheet-toolbar">
      <div class="mode-tabs">
        <button class="hist-tab active" data-view="week">주간</button>
        <button class="hist-tab" data-view="month">월간</button>
      </div>
      <div class="period-nav">
        <button id="prevPeriod" class="nav-btn" aria-label="이전">‹</button>
        <span id="periodLabel"></span>
        <button id="nextPeriod" class="nav-btn" aria-label="다음">›</button>
      </div>
    </div>

    <div class="summary-row">
      <div class="stat"><span class="stat-label">총 공부 시간</span><strong id="statTotal">0분</strong></div>
      <div class="stat"><span class="stat-label">공부한 날</span><strong id="statDays">0일</strong></div>
      <div class="stat"><span class="stat-label">하루 평균</span><strong id="statAvg">-</strong></div>
    </div>

    <div id="historyChart" class="history-chart"></div>
    <p id="historyEmpty" class="empty" hidden>기록이 없어요</p>

    <div id="historyListBox">
      <h3 id="historyListTitle" class="drawer-sub">이 주의 기록</h3>
      <ul id="historyList" class="record-list"></ul>
    </div>

    <!-- SNS에 올릴 이미지 만들기 (canvas로 그려서 PNG로 저장) -->
    <div class="share-box">
      <h3 class="drawer-sub">SNS에 올릴 이미지 만들기</h3>
      <canvas id="shareCanvas" class="share-preview" aria-label="SNS 이미지 미리보기"></canvas>
      <div class="share-buttons">
        <button id="shareSave" class="btn primary" type="button">이미지 저장</button>
        <button id="shareSend" class="btn" type="button" hidden>공유하기</button>
      </div>
      <p id="shareToast" class="toast" aria-live="polite"></p>
    </div>
  </section>

  <!-- ⑤ 생각 보관함 : 사이드바의 "생각 보관함"을 누르면 왼쪽에서 열리는 창 -->
  <section id="vaultDrawer" class="drawer drawer-left" role="dialog" aria-modal="true" aria-labelledby="vaultTitle">
    <div class="sheet-head">
      <h2 id="vaultTitle">생각 보관함</h2>
      <button id="closeVault" class="icon-close" aria-label="닫기">×</button>
    </div>

    <div class="drawer-toolbar">
      <select id="filterSelect" aria-label="카테고리 필터"></select>
      <span id="vaultTotal" class="muted"></span>
    </div>

    <div id="vaultList"></div>
  </section>

  <!-- ⑥ 공부 질문 창 : 시작 전 화면에서 '📌 공부 질문'을 누르면 뜸 -->
  <div id="qModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="qTitle" hidden>
    <div class="modal-box">
      <div class="sheet-head">
        <h2 id="qTitle">📌 공부 질문</h2>
        <button id="qClose" class="icon-close" aria-label="닫기">×</button>
      </div>
      <form id="qForm" class="q-form">
        <input id="qInput" type="text" maxlength="100" placeholder="질문 추가 (Enter)">
      </form>
      <ul id="qList" class="sticky-list"></ul>
      <p id="qEmpty" class="empty">아직 질문이 없어요</p>
    </div>
  </div>

  <!-- ⑦ 공부를 마치면 뜨는 창 : 이번 공부 동안 적은 생각만 보여 줌 → '확인 완료'로 닫기 -->
  <div id="reviewModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reviewTitle" hidden>
    <div class="modal-box">
      <h2 id="reviewTitle"></h2>
      <p id="reviewDesc" class="muted"></p>
      <ul id="reviewList" class="memo-list review-list"></ul>
      <button id="reviewDone" class="btn primary" type="button">확인 완료</button>
    </div>
  </div>

  <script src="script.js?v=20261126-4"></script>
</body>
</html>
